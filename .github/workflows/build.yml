name: build-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 34 + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/zy.jks"

      - name: Build
        working-directory: client
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          SERVER: ${{ vars.ZY_SERVER }}
          UPDATE_SERVER: ${{ vars.ZY_UPDATE_SERVER }}
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/zy.jks', runner.temp) || '' }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ -z "$VER" ] && VER="dev-${GITHUB_SHA::7}"
          ./build.sh "$VER" "${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
