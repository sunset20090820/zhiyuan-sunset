name: build-apk

# 只在手动触发（或打 tag）时运行：普通 push 不会产生运行，也就不会发失败邮件
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（留空则用 dev-<sha>）'
        required: false
        default: ''
      version_code:
        description: 'versionCode（留空则用运行序号）'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      # 有 keystore 就解出来签名；没有就产出未签名包（build.sh 支持）
      - name: Restore keystore (optional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/zy.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/zy.jks" >> "$GITHUB_ENV"
            echo "已恢复 keystore"
          else
            echo "没有配置 KEYSTORE_BASE64，将产出未签名包"
          fi

      - name: Build APK
        working-directory: client
        env:
          SERVER: ${{ vars.ZY_SERVER }}
          UPDATE_SERVER: ${{ vars.ZY_UPDATE_SERVER }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          set -e
          VER="${{ inputs.version_name }}"
          CODE="${{ inputs.version_code }}"
          [ -z "$VER" ] && VER="dev-${GITHUB_SHA::7}"
          [ -z "$CODE" ] && CODE="${GITHUB_RUN_NUMBER}"
          export KEYSTORE="${KEYSTORE_PATH:-}"
          echo "构建 $VER ($CODE)"
          ./build.sh "$VER" "$CODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 14
